<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BuildSmart.Maui</title>
    <base href="/" />
    
    <script>
        (function () {
            if (navigator.permissions && navigator.permissions.query) {
                try {
                    navigator.permissions.query = navigator.permissions.query.bind(navigator.permissions);
                } catch (e) { }
            }
            
            // Global cookie helper
            window.setCookie = function(name, value, days) {
                var expires = "";
                if (days) {
                    var date = new Date();
                    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                    expires = "; expires=" + date.toUTCString();
                }
                document.cookie = name + "=" + (value || "") + expires + "; path=/";
            };

            // Microsoft Clarity Initializer
            window.initializeClarity = function (projectId) {
                if (!projectId || window.clarityInitialized) return;
                window.clarityInitialized = true;
                (function(c,l,a,r,i,t,y){
                    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                    y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
                })(window, document, "clarity", "script", projectId);
            };
        })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="_content/BuildSmart.SharedUI/css/app.css?v=1.1" />
    <link rel="stylesheet" href="BuildSmart.Maui.styles.css" />
    <link rel="stylesheet" href="_content/BuildSmart.SharedUI/BuildSmart.SharedUI.bundle.scp.css" />
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

    </div>

</body>
