name: Debug Deployment Configuration

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print Configuration details (unmasked)
        run: |
          host="${{ secrets.VPS_HOST }}"
          echo -n "Host: "
          for (( i=0; i<${#host}; i++ )); do
            echo -n "${host:$i:1} "
          done
          echo ""

          user="${{ secrets.VPS_USER }}"
          echo -n "User: "
          for (( i=0; i<${#user}; i++ )); do
            echo -n "${user:$i:1} "
          done
          echo ""
