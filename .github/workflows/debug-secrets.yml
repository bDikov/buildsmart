name: Debug Deployment Configuration

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print Configuration details (masked values check)
        run: |
          echo "Host (Base64):"
          echo -n "${{ secrets.VPS_HOST }}" | base64
          echo "User (Base64):"
          echo -n "${{ secrets.VPS_USER }}" | base64
