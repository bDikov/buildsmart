query GetFeedMedia($where: TradesmanMediaFilterInput) {
  feedMedia(where: $where) {
    id
    tradesmanId
    videoUrl
    imageUrl
    type
    serviceCategoryId
    serviceCategory {
      name
    }
    tradesmanProfile {
      averageRating
      user {
        firstName
        lastName
        location
        profilePictureUrl
      }
      skills {
        serviceCategory {
          name
        }
      }
    }
  }
}