query GetUsers {
  users {
    id
    firstName
    lastName
    email
    role
    lastSeenAt
    activeStatus
    tradesmanProfile {
      id
      skills {
        serviceCategoryId
      }
    }
  }
}

mutation UpdateUserRoleAndCategories($userId: UUID!, $newRole: UserRoleTypes!, $serviceCategoryIds: [UUID!]) {
  updateUserRoleAndCategories(userId: $userId, newRole: $newRole, serviceCategoryIds: $serviceCategoryIds) {
    id
    role
    tradesmanProfile {
      id
      skills {
        serviceCategoryId
      }
    }
  }
}

query SearchUsers($where: UserFilterInput) {
  users(where: $where) {
    id
    firstName
    lastName
    email
    isOnline
  }
}
