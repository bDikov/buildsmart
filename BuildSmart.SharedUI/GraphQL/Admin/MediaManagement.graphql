query GetMediaFolders($parentId: UUID) {
  mediaFolders(parentId: $parentId) {
    id
    name
    slug
    fullPath
    parentId
    isSystem
    itemCount
    subFolderCount
    createdAt
    updatedAt
  }
}

query GetMediaFolderByPath($fullPath: String!) {
  mediaFolderByPath(fullPath: $fullPath) {
    id
    name
    slug
    fullPath
    parentId
    isSystem
    itemCount
    subFolderCount
    createdAt
    updatedAt
  }
}

query GetMediaAssets($folderId: UUID, $mediaType: String, $searchTerm: String, $skip: Int, $take: Int) {
  mediaAssets(folderId: $folderId, mediaType: $mediaType, searchTerm: $searchTerm, skip: $skip, take: $take) {
    totalCount
    items {
      id
      folderId
      folderPath
      fileName
      r2Key
      publicUrl
      thumbnailUrl
      mediaType
      contentType
      sizeBytes
      width
      height
      durationSeconds
      altTextBg
      altTextEn
      createdAt
      updatedAt
    }
  }
}

mutation CreateMediaFolder($name: String!, $parentId: UUID) {
  createMediaFolder(name: $name, parentId: $parentId) {
    id
    name
    slug
    fullPath
    parentId
    isSystem
    itemCount
    subFolderCount
    createdAt
    updatedAt
  }
}

mutation RenameMediaFolder($id: UUID!, $newName: String!) {
  renameMediaFolder(id: $id, newName: $newName) {
    id
    name
    slug
    fullPath
    parentId
    isSystem
    itemCount
    subFolderCount
    createdAt
    updatedAt
  }
}

mutation DeleteMediaFolder($id: UUID!) {
  deleteMediaFolder(id: $id)
}

mutation RequestFolderUploadUrl($folderPath: String!, $fileName: String!, $contentType: String!) {
  requestFolderUploadUrl(folderPath: $folderPath, fileName: $fileName, contentType: $contentType)
}

mutation RegisterUploadedMedia(
  $folderId: UUID
  $r2Key: String!
  $fileName: String!
  $contentType: String!
  $sizeBytes: Long!
  $width: Int
  $height: Int
  $durationSeconds: Float
) {
  registerUploadedMedia(
    folderId: $folderId
    r2Key: $r2Key
    fileName: $fileName
    contentType: $contentType
    sizeBytes: $sizeBytes
    width: $width
    height: $height
    durationSeconds: $durationSeconds
  ) {
    id
    folderId
    folderPath
    fileName
    r2Key
    publicUrl
    thumbnailUrl
    mediaType
    contentType
    sizeBytes
    width
    height
    durationSeconds
    altTextBg
    altTextEn
    createdAt
    updatedAt
  }
}

mutation UpdateMediaAsset($id: UUID!, $altTextBg: String, $altTextEn: String, $fileName: String, $folderId: UUID) {
  updateMediaAsset(id: $id, altTextBg: $altTextBg, altTextEn: $altTextEn, fileName: $fileName, folderId: $folderId) {
    id
    folderId
    folderPath
    fileName
    r2Key
    publicUrl
    thumbnailUrl
    mediaType
    contentType
    sizeBytes
    width
    height
    durationSeconds
    altTextBg
    altTextEn
    createdAt
    updatedAt
  }
}

mutation MoveMediaAsset($id: UUID!, $targetFolderId: UUID) {
  moveMediaAsset(id: $id, targetFolderId: $targetFolderId) {
    id
    folderId
    folderPath
    fileName
    r2Key
    publicUrl
    thumbnailUrl
    mediaType
    contentType
    sizeBytes
    width
    height
    durationSeconds
    altTextBg
    altTextEn
    createdAt
    updatedAt
  }
}

mutation DeleteMediaAsset($id: UUID!) {
  deleteMediaAsset(id: $id)
}
