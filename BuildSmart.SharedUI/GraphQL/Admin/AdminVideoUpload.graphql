mutation RequestVideoUploadUrl($fileName: String!, $contentType: String!) {
  requestVideoUploadUrl(fileName: $fileName, contentType: $contentType)
}
mutation ConfirmVideoUpload($tradesmanUserId: UUID!, $videoUrl: String!, $imageUrl: String, $type: MediaType!, $serviceCategoryId: UUID) {
  confirmVideoUpload(tradesmanUserId: $tradesmanUserId, videoUrl: $videoUrl, imageUrl: $imageUrl, type: $type, serviceCategoryId: $serviceCategoryId) {
    id
    videoUrl
    mobileVideoUrl
    imageUrl
    type
    isActive
  }
}
mutation UpdateTradesmanMediaCategory($mediaId: UUID!, $categoryId: UUID) {
  updateTradesmanMediaCategory(mediaId: $mediaId, categoryId: $categoryId) {
    id
    serviceCategory {
      name
    }
  }
}