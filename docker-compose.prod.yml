version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-buildsmart_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-buildsmart_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: buildsmart-api:latest
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB:-buildsmart_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_password}
      - ASPNETCORE_URLS=http://+:8080
      # Provide valid Gemini API Key on VPS
      - Gemini__ApiKey=${GEMINI_API_KEY}
      # Google OAuth
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      # Sentry Error Tracking
      - SENTRY_DSN=${SENTRY_DSN}
      # Cloudflare R2 Media
      - CloudflareR2__ServiceUrl=${CLOUDFLARE_R2_SERVICE_URL}
      - CloudflareR2__SecretKey=${CLOUDFLARE_R2_SECRET_KEY}
      - CloudflareR2__PublicUrl=${CLOUDFLARE_R2_PUBLIC_URL}
      - CloudflareR2__BucketName=${CLOUDFLARE_R2_BUCKET_NAME}
      - CloudflareR2__AccessKey=${CLOUDFLARE_R2_ACCESS_KEY}
      # SMTP Mail Server
      - Smtp__Server=${SMTP_SERVER:-smtp-relay.brevo.com}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__SenderEmail=${SMTP_SENDER_EMAIL:-support@buildsmart.bg}
      - Smtp__SenderName=${SMTP_SENDER_NAME:-BuildSmart}
      - HANGFIRE_DASHBOARD_TOKEN=${HANGFIRE_DASHBOARD_TOKEN}
    volumes:
      - blog_images_data:/app/wwwroot/images/blog
    depends_on:
      db:
        condition: service_healthy

  web:
    image: buildsmart-web:latest
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Inform the Web UI where the GraphQL endpoint lives, using the Caddy domain
      - ApiConfig__BaseUrlOverride=https://${DOMAIN_WEB:-app.buildsmart.localhost}
      - PostHog__ApiKey=${POSTHOG_API_KEY}
      - PostHog__ApiHost=${POSTHOG_API_HOST:-https://us.i.posthog.com}
    volumes:
      - blog_images_data:/app/wwwroot/images/blog
      - blog_posts_data:/app/wwwroot/posts
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_WEB=${DOMAIN_WEB:-app.buildsmart.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  blog_images_data:
  blog_posts_data: