version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-buildsmart_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-buildsmart_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  api:
    image: buildsmart-api:latest
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB:-buildsmart_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_password}
      - ASPNETCORE_URLS=http://+:8080
      # Provide valid Gemini API Key on VPS
      - Gemini__ApiKey=${GEMINI_API_KEY}
      # Google OAuth
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      # Facebook OAuth & Webhooks
      - Authentication__Facebook__EnableFacebookLogin=${FACEBOOK_ENABLE_LOGIN:-false}
      - Authentication__Facebook__AppId=${FACEBOOK_APP_ID}
      - Authentication__Facebook__AppSecret=${FACEBOOK_APP_SECRET}
      - Authentication__Facebook__VerifyToken=${FACEBOOK_VERIFY_TOKEN}
      - Authentication__Facebook__PixelId=${FACEBOOK_PIXEL_ID}
      # Sentry Error Tracking
      - SENTRY_DSN=${SENTRY_DSN}
      # Axiom Cloud Logging (500GB/mo free)
      - AXIOM_TOKEN=${AXIOM_TOKEN}
      - AXIOM_DATASET=${AXIOM_DATASET:-buildsmart-prod}
      # Cloudflare R2 Media
      - CloudflareR2__ServiceUrl=${CLOUDFLARE_R2_SERVICE_URL}
      - CloudflareR2__SecretKey=${CLOUDFLARE_R2_SECRET_KEY}
      - CloudflareR2__PublicUrl=${CLOUDFLARE_R2_PUBLIC_URL}
      - CloudflareR2__BucketName=${CLOUDFLARE_R2_BUCKET_NAME}
      - CloudflareR2__AccessKey=${CLOUDFLARE_R2_ACCESS_KEY}
      # SMTP Mail Server
      - Smtp__Server=${SMTP_SERVER:-smtp-relay.brevo.com}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__SenderEmail=${SMTP_SENDER_EMAIL:-support@buildsmart.bg}
      - Smtp__SenderName=${SMTP_SENDER_NAME:-BuildSmart}
      - HANGFIRE_DASHBOARD_TOKEN=${HANGFIRE_DASHBOARD_TOKEN}
      # Telegram Bot Notifications
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__ChatId=${TELEGRAM_CHAT_ID}
      - Telegram__Enabled=${TELEGRAM_ENABLED:-true}
      - Telegram__WebhookSecretToken=${TELEGRAM_WEBHOOK_SECRET_TOKEN}
    volumes:
      - blog_images_data:/app/wwwroot/images/blog
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  web:
    image: buildsmart-web:latest
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB:-buildsmart_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_password}
      - ASPNETCORE_URLS=http://+:8080
      # Inform the Web UI where the GraphQL endpoint lives, using the Caddy domain
      - ApiConfig__BaseUrlOverride=https://${DOMAIN_WEB:-app.buildsmart.localhost}
      - Authentication__Facebook__EnableFacebookLogin=${FACEBOOK_ENABLE_LOGIN:-false}
      - PostHog__ApiKey=${POSTHOG_API_KEY}
      - PostHog__ApiHost=${POSTHOG_API_HOST:-https://us.i.posthog.com}
      # SMTP Mail Server
      - Smtp__Server=${SMTP_SERVER:-smtp-relay.brevo.com}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__SenderEmail=${SMTP_SENDER_EMAIL:-office@buildsmart.bg}
      - Smtp__SenderName=${SMTP_SENDER_NAME:-BuildSmart}
      # Telegram Bot Notifications
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__ChatId=${TELEGRAM_CHAT_ID}
      - Telegram__Enabled=${TELEGRAM_ENABLED:-true}
    volumes:
      - blog_images_data:/app/wwwroot/images/blog
      - blog_posts_data:/app/wwwroot/posts
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - api

  autoheal:
    image: willfarrell/autoheal:latest
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_WEB=${DOMAIN_WEB:-app.buildsmart.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  blog_images_data:
  blog_posts_data: